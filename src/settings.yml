static_data: '{"catalogue_version":"0.3.0","epoch_local_day":20743,"entries":[{"id":"le-001","en":"Tomorrow is a fresh start.\nFor the same problems.","de":"Morgen ist ein Neuanfang.\nFür die gleichen Probleme."},{"id":"le-002","en":"Your reward for finishing early is finding out what else needs doing.","de":"Wer früher fertig ist, erfährt früher, was sonst noch zu tun ist."},{"id":"le-003","en":"Every meeting ends.\nSome become weekly.","de":"Jede Besprechung endet.\nManche werden wöchentlich."},{"id":"le-004","en":"Your idea has potential.\nThat’s what they say before shelving it.","de":"Deine Idee hat Potenzial.\nSo nennt man Dinge, die man später ablegt."},{"id":"le-005","en":"You finally have a plan.\nReality has not approved it.","de":"Du hast endlich einen Plan.\nDie Realität hat ihn noch nicht freigegeben."},{"id":"le-006","en":"Your laundry is done.\nThe chair has accepted delivery.","de":"Deine Wäsche ist fertig.\nDer Stuhl hat die Lieferung angenommen."},{"id":"le-007","en":"Your inbox is empty.\nSomeone is already working on that.","de":"Dein Posteingang ist leer.\nJemand arbeitet bereits daran."},{"id":"le-008","en":"You proved you can handle more.\nThey took that literally.","de":"Du hast gezeigt, dass du mehr schaffst.\nDas wurde wörtlich genommen."},{"id":"le-009","en":"You found a shortcut.\nIt needs three approvals.","de":"Du hast eine Abkürzung gefunden.\nSie braucht drei Genehmigungen."},{"id":"le-010","en":"You bought a planner.\nYour problems now have page numbers.","de":"Du hast einen Planer gekauft.\nDeine Probleme haben jetzt Seitenzahlen."},{"id":"le-011","en":"Good news: the problem is solved.\nWe’ve renamed it.","de":"Gute Nachrichten: Das Problem ist gelöst.\nWir haben es umbenannt."},{"id":"le-012","en":"You finally have a free afternoon.\nThe house has submitted a proposal.","de":"Du hast endlich einen freien Nachmittag.\nDas Haus hat einen Vorschlag eingereicht."},{"id":"le-013","en":"Progress is happening.\nMostly in the status report.","de":"Es geht voran.\nHauptsächlich im Statusbericht."},{"id":"le-014","en":"You made a list of priorities.\nThey’re all first.","de":"Du hast deine Prioritäten sortiert.\nAlle stehen an erster Stelle."},{"id":"le-015","en":"You have reached the learning stage called “doing it again”.","de":"Du hast die Lernphase «noch einmal machen» erreicht."},{"id":"le-016","en":"You tidied the house.\nEveryone else is handling the reversal.","de":"Du hast aufgeräumt.\nAlle anderen kümmern sich um den Rückbau."},{"id":"le-017","en":"You bought time-saving tools.\nThey need an update.","de":"Du hast dir zeitsparende Geräte gekauft.\nSie brauchen ein Update."},{"id":"le-018","en":"They asked for your honest opinion.\nThey meant the approved version.","de":"Sie wollten deine ehrliche Meinung.\nGemeint war die freigegebene Version."},{"id":"le-019","en":"Your new routine is working.\nAround your old routine.","de":"Deine neue Routine funktioniert.\nRund um deine alte Routine."},{"id":"le-020","en":"Your to-do list believes in you.\nAn unreasonable amount.","de":"Deine Aufgabenliste glaubt an dich.\nIn einem völlig unrealistischen Ausmass."},{"id":"le-021","en":"The task took five minutes.\nExplaining it took the afternoon.","de":"Die Aufgabe dauerte fünf Minuten.\nDie Erklärung den ganzen Nachmittag."},{"id":"le-022","en":"You’ve earned a break.\nIt has been added to the backlog.","de":"Du hast dir eine Pause verdient.\nSie steht jetzt auf der Pendenzenliste."},{"id":"le-023","en":"The first draft is finished.\nEveryone has just found their opinions.","de":"Der erste Entwurf ist fertig.\nJetzt haben plötzlich alle eine Meinung."},{"id":"le-024","en":"A small change can make a big difference.\nThat’s why we need a new quote.","de":"Eine kleine Änderung kann viel bewirken.\nDeshalb brauchen wir eine neue Offerte."},{"id":"le-025","en":"Leave room for surprises.\nYour estimates already do.","de":"Lass Platz für Überraschungen.\nDeine Schätzungen tun das bereits."},{"id":"le-026","en":"You’re thinking outside the box.\nPlease use the standard template.","de":"Du denkst über den Tellerrand hinaus.\nBitte benutze die Standardvorlage."},{"id":"le-027","en":"Your five-year plan has a promising first afternoon.","de":"Dein Plan für fünf Jahre hat einen guten ersten Nachmittag."},{"id":"le-028","en":"The problem has been escalated.\nIt now has more witnesses.","de":"Das Problem wurde eskaliert.\nEs hat jetzt mehr Zuschauer."},{"id":"le-029","en":"You learned to say no.\nThey’ve scheduled a meeting about it.","de":"Du hast gelernt, Nein zu sagen.\nDazu gibt es jetzt eine Besprechung."},{"id":"le-030","en":"The instructions were clear.\nBefore the clarifications.","de":"Die Anleitung war klar.\nVor den Erläuterungen."},{"id":"le-031","en":"Start with the easy part.\nThere isn’t one.","de":"Fang mit dem einfachen Teil an.\nDen gibt es nicht."},{"id":"le-032","en":"The queue beside you moves faster.\nThat is its only job.","de":"Die Schlange neben dir ist schneller.\nDas ist ihre einzige Aufgabe."},{"id":"le-033","en":"Your phone remembers every password.\nExcept when you need one.","de":"Dein Handy kennt alle Passwörter.\nAusser wenn du eines brauchst."},{"id":"le-034","en":"Keep your options open.\nIt makes choosing take longer.","de":"Halte dir alle Möglichkeiten offen.\nDann dauert die Entscheidung länger."},{"id":"le-035","en":"The parcel will arrive between eight and the end of your patience.","de":"Dein Paket kommt zwischen acht Uhr und dem Ende deiner Geduld."},{"id":"le-036","en":"You’ve found your calling.\nIt doesn’t cover the rent.","de":"Du hast deine Berufung gefunden.\nDie Miete übernimmt sie nicht."},{"id":"le-037","en":"The recipe says twenty minutes.\nIt hasn’t seen your kitchen.","de":"Das Rezept sagt zwanzig Minuten.\nEs kennt deine Küche nicht."},{"id":"le-038","en":"You scheduled some rest.\nNow you’re behind on relaxing.","de":"Du hast Erholung eingeplant.\nJetzt bist du beim Entspannen im Rückstand."},{"id":"le-039","en":"The cactus was low maintenance.\nApparently, not low enough.","de":"Der Kaktus war pflegeleicht.\nOffenbar nicht leicht genug."},{"id":"le-040","en":"A new hobby is a lovely way to turn cupboard space into guilt.","de":"Ein neues Hobby verwandelt freien Schrankplatz zuverlässig in ein schlechtes Gewissen."},{"id":"le-041","en":"You left early to avoid traffic.\nSo did the traffic.","de":"Du bist früher los, um den Stau zu vermeiden.\nDer Stau auch."},{"id":"le-042","en":"Measure twice.\nBuy the wrong thing with confidence.","de":"Miss zweimal nach.\nKauf dann mit Überzeugung das Falsche."},{"id":"le-043","en":"There’s no such thing as a stupid question.\nYou have inspired a review.","de":"Es gibt keine dummen Fragen.\nDeine wird gerade geprüft."},{"id":"le-044","en":"The weather app promises sunshine.\nOutside would like a word.","de":"Die Wetter-App verspricht Sonne.\nDraussen sieht man das anders."},{"id":"le-045","en":"Trust the process.\nIt has no idea either.","de":"Vertrau dem Prozess.\nEr weiss es auch nicht."},{"id":"le-046","en":"The budget is balanced.\nUntil anything happens.","de":"Das Budget ist ausgeglichen.\nSolange nichts passiert."},{"id":"le-047","en":"Dream big.\nDisappointment scales.","de":"Träum gross.\nEnttäuschung wächst mit."},{"id":"le-048","en":"Some doors open only once.\nUsually while you’re carrying too much.","de":"Manche Türen öffnen sich nur einmal.\nMeistens, wenn du die Hände voll hast."},{"id":"le-049","en":"Your headphones are wireless.\nFinding them is still a hands-on job.","de":"Deine Kopfhörer sind kabellos.\nDie Suche bleibt Handarbeit."},{"id":"le-050","en":"You slept on the decision.\nNow you’re tired and undecided.","de":"Du hast eine Nacht darüber geschlafen.\nJetzt bist du müde und unentschlossen."},{"id":"le-051","en":"Good things take time.\nSo do the other things.","de":"Gut Ding will Weile haben.\nDer Rest leider auch."},{"id":"le-052","en":"The alarm believes in your potential.\nYou keep correcting it.","de":"Dein Wecker glaubt an dein Potenzial.\nDu widersprichst alle neun Minuten."},{"id":"le-053","en":"Ask for a sign.\nRoadworks are usually available.","de":"Bitte um ein Zeichen.\nBaustellenschilder gibt es genug."},{"id":"le-054","en":"Your cloud storage is full.\nEven the sky has limits.","de":"Deine Cloud ist voll.\nSelbst der Himmel hat seine Grenzen."},{"id":"le-055","en":"The missing sock has moved on.\nYou should try it.","de":"Die verschwundene Socke hat losgelassen.\nVersuch es auch."},{"id":"le-056","en":"Your promotion came with a better chair.\nYou’ll be in it longer.","de":"Zur Beförderung gab es einen besseren Stuhl.\nDu wirst länger darin sitzen."},{"id":"le-057","en":"Choose your battles.\nThe fitted sheet has already won.","de":"Wähl deine Kämpfe mit Bedacht.\nDas Fixleintuch hat schon gewonnen."},{"id":"le-058","en":"You got there in the end.\nIt was closed.","de":"Du bist endlich angekommen.\nEs war geschlossen."},{"id":"le-059","en":"Your future self can handle this.\nThat’s what your past self said.","de":"Dein zukünftiges Ich schafft das.\nDas hat dein früheres Ich auch gesagt."},{"id":"le-060","en":"Celebrate the small wins.\nThe large ones are still buffering.","de":"Feier die kleinen Erfolge.\nDie grossen werden noch geladen."},{"id":"le-061","en":"Pick one thing to worry about.\nThe others will wait their turn.","de":"Such dir eine Sorge aus.\nDie anderen warten, bis sie dran sind."},{"id":"le-062","en":"You went in for milk.\nThe receipt tells a longer story.","de":"Du wolltest nur Milch holen.\nDer Kassenzettel erzählt mehr."},{"id":"le-063","en":"Failure builds character.\nThe extension is getting expensive.","de":"Scheitern bildet den Charakter.\nDer Anbau wird langsam teuer."},{"id":"le-064","en":"The charger is in your bag.\nThe bag is somewhere else.","de":"Das Ladegerät ist in deiner Tasche.\nDie Tasche ist woanders."},{"id":"le-065","en":"They said you’d laugh about this one day.\nNo date has been confirmed.","de":"Eines Tages wirst du darüber lachen.\nEin Termin steht noch aus."},{"id":"le-066","en":"Your unsubscribe request was successful.\nWe’ve emailed you about it.","de":"Du hast dich erfolgreich abgemeldet.\nDie Bestätigung kommt per E-Mail."},{"id":"le-067","en":"Be spontaneous.\nCheck everyone’s calendar first.","de":"Sei spontan.\nPrüf zuerst die Kalender von allen anderen."},{"id":"le-068","en":"The towel rail has come loose.\nThe repair video has twelve parts.","de":"Der Handtuchhalter ist locker.\nDas Reparaturvideo hat zwölf Teile."},{"id":"le-069","en":"Your subscription is flexible.\nOnly the cancellation date is fixed.","de":"Dein Abo ist flexibel.\nNur der Kündigungstermin steht fest."},{"id":"le-070","en":"You saved the good notebook for something special.\nIt’s ageing beautifully.","de":"Du sparst das schöne Notizbuch für etwas Besonderes auf.\nEs altert sehr würdevoll."},{"id":"le-071","en":"Your savings are growing.\nYour wishlist has a head start.","de":"Dein Erspartes wächst.\nDeine Wunschliste hatte einen grossen Vorsprung."},{"id":"le-072","en":"The train was on time.\nYou were still buying the ticket.","de":"Der Zug war pünktlich.\nDu warst noch am Billettautomaten."},{"id":"le-073","en":"The sun came out.\nMostly to show you the dust.","de":"Die Sonne ist da.\nVor allem, damit du den Staub besser siehst."},{"id":"le-074","en":"You know exactly what you want.\nIt’s been discontinued.","de":"Du weisst genau, was du willst.\nEs wird nicht mehr hergestellt."},{"id":"le-075","en":"Try a different approach.\nThe error message deserves some variety.","de":"Versuch einen anderen Weg.\nDie Fehlermeldung braucht etwas Abwechslung."},{"id":"le-076","en":"Your shoes are made for adventure.\nThey live under the desk.","de":"Deine Schuhe sind für Abenteuer gemacht.\nSie wohnen unter dem Schreibtisch."},{"id":"le-077","en":"The customer survey takes two minutes.\nYour complaint needs a novel.","de":"Die Umfrage dauert zwei Minuten.\nDeine Beschwerde bräuchte einen Roman."},{"id":"le-078","en":"Speak your mind.\nThen enjoy remembering it at three in the morning.","de":"Sag, was du denkst.\nUm drei Uhr morgens kannst du es nochmals durchgehen."},{"id":"le-079","en":"The meal plan is balanced.\nMostly between leftovers and giving up.","de":"Dein Menüplan ist ausgewogen.\nHalb Reste, halb Kapitulation."},{"id":"le-080","en":"Everyone deserves a second chance.\nYour printer is on its forty-third.","de":"Alle verdienen eine zweite Chance.\nDein Drucker ist bei Nummer dreiundvierzig."},{"id":"le-081","en":"The self-checkout needs assistance.\nYou were hoping it could provide some.","de":"Die Self-Checkout-Kasse braucht Hilfe.\nDu hattest auf das Gegenteil gehofft."},{"id":"le-082","en":"Your home has an open-plan layout.\nSo does the noise.","de":"Deine Wohnung ist offen gestaltet.\nDer Lärm hält sich daran."},{"id":"le-083","en":"You can have it all.\nFinding a drawer for it is your problem.","de":"Du kannst alles haben.\nEine Schublade dafür musst du selbst finden."},{"id":"le-084","en":"Your memory is excellent.\nEspecially for things you’d rather forget.","de":"Dein Gedächtnis ist ausgezeichnet.\nVor allem bei Dingen, die du vergessen möchtest."},{"id":"le-085","en":"Pack light.\nThe things you forget will barely weigh anything.","de":"Reise mit leichtem Gepäck.\nDie vergessenen Sachen wiegen praktisch nichts."},{"id":"le-086","en":"The furniture has one spare screw.\nYour confidence has left the room.","de":"Nach dem Aufbau bleibt eine Schraube übrig.\nDein Selbstvertrauen hat den Raum verlassen."},{"id":"le-087","en":"You asked for constructive criticism.\nThey brought demolition equipment.","de":"Du wolltest konstruktive Kritik.\nSie haben das Abrissgerät mitgebracht."},{"id":"le-088","en":"Life has no instruction manual.\nThe help desk is also closed.","de":"Das Leben hat keine Anleitung.\nDer Kundendienst ist ebenfalls geschlossen."},{"id":"le-089","en":"Your hard work will be noticed.\nUsually when you stop doing it.","de":"Deine harte Arbeit fällt auf.\nMeistens, sobald du damit aufhörst."},{"id":"le-090","en":"Make time for what matters.\nThe washing machine has finished again.","de":"Nimm dir Zeit für das Wesentliche.\nDie Waschmaschine ist schon wieder fertig."}]}'
